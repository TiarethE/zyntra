<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zyntra · Envíos</title>
  <link rel="icon" href="/estatico/logo.svg" type="image/svg+xml">
  <link rel="preload" href="/estatico/fuentes/archivo.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/estatico/app.css">
  <script>
    // Aplica el tema guardado antes de pintar, para que no parpadee.
    try { const t = localStorage.getItem("zyntra-tema"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <!-- Dibujos reutilizables: vehículos por tipo de envío y la estrella de la bandera. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="v-nacional" viewBox="0 0 32 20">
        <rect x="1" y="3" width="18" height="11" rx="2" fill="currentColor"/>
        <path d="M20 6h6l4 4.5V14H20z" fill="currentColor"/>
        <path d="M22 7.5h3.4l2.4 2.8H22z" fill="#fff" opacity=".85"/>
        <circle cx="7" cy="15.5" r="2.8" fill="#10202e" stroke="#fff" stroke-width="1.2"/>
        <circle cx="24.5" cy="15.5" r="2.8" fill="#10202e" stroke="#fff" stroke-width="1.2"/>
      </symbol>
      <symbol id="v-internacional" viewBox="0 0 32 20">
        <path d="M2 10.6c0-.9.6-1.5 1.6-1.5H13L8.6 1.4h3.1l7.5 7.7h7.1c2.3 0 4.2.6 4.2 1.5s-1.9 1.5-4.2 1.5h-7.1l-7.5 7.7H8.6L13 12.1H3.6c-1 0-1.6-.6-1.6-1.5z" fill="currentColor"/>
        <path d="M2.4 7.2h2.7l2 2.1H3.6z" fill="currentColor"/>
      </symbol>
      <symbol id="v-express" viewBox="0 0 32 20">
        <path d="M1 7h7M3 10.5h6M1 14h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M11 13.5h8.5l3-6.5h3.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="11.5" y="5" width="7" height="6" rx="1.2" fill="currentColor"/>
        <circle cx="13" cy="15" r="3.2" fill="#10202e" stroke="#fff" stroke-width="1.2"/>
        <circle cx="27" cy="15" r="3.2" fill="#10202e" stroke="#fff" stroke-width="1.2"/>
      </symbol>
      <symbol id="estrella" viewBox="0 0 20 20">
        <polygon points="10,1 12.4,7.3 19.1,7.6 13.9,11.8 15.6,18.3 10,14.6 4.4,18.3 6.1,11.8 0.9,7.6 7.6,7.3" fill="currentColor"/>
      </symbol>
      <symbol id="caja-vacia" viewBox="0 0 120 90">
        <path d="M60 18 98 34v36L60 86 22 70V34z" fill="var(--marca-suave)"/>
        <path d="M60 18 98 34 60 50 22 34z" fill="var(--superficie)" stroke="var(--marca)" stroke-width="2" stroke-linejoin="round"/>
        <path d="M22 34v36l38 16V50zM98 34v36L60 86V50z" fill="none" stroke="var(--marca)" stroke-width="2" stroke-linejoin="round"/>
        <path d="M41 26l38 16v10" fill="none" stroke="var(--acento)" stroke-width="5" stroke-linejoin="round"/>
        <use href="#estrella" x="86" y="2" width="16" height="16" color="var(--turquesa)"/>
      </symbol>
    </defs>
  </svg>

  <a class="saltar" href="#vista">Ir al contenido</a>

  <div class="app" id="app">
    <aside class="lateral" id="lateral">
      <a class="marca" href="#/panel" aria-label="Zyntra, ir al panel">
        <svg class="logo" viewBox="0 0 40 40" width="38" height="38" aria-hidden="true">
          <circle class="logo-origen" cx="9" cy="11" r="3" fill="#18b4d8"/>
          <path class="logo-ruta" d="M9 11H29L11 29H25" fill="none" stroke="#18b4d8" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" pathLength="100"/>
          <use class="logo-estrella" href="#estrella" x="25" y="22.5" width="13" height="13" color="#ff9f1c"/>
        </svg>
        <span class="texto-marca"><strong>zyntra</strong><small>Envíos desde Honduras</small></span>
      </a>
      <nav id="menu" aria-label="Secciones"></nav>
      <div class="pie-lateral">
        <div class="tarjeta-sucursal">
          <span class="avatar" aria-hidden="true">TC</span>
          <span class="texto-marca"><strong>Sucursal Tegucigalpa</strong><small>Operación</small></span>
        </div>
      </div>
    </aside>

    <div class="principal">
      <header class="barra" id="barra">
        <button class="icono-btn solo-movil" id="abrir-menu" aria-label="Abrir menú"></button>
        <button class="buscador-global" id="abrir-paleta" type="button">
          <span class="ico-buscar" aria-hidden="true"></span>
          <span>Buscar guía, cliente o acción</span>
          <kbd>Ctrl K</kbd>
        </button>
        <div class="acciones-barra">
          <span class="en-vivo" id="conexion" title="Conexión en tiempo real"><i></i><span>Conectando</span></span>
          <label class="interruptor-chico" title="Marca qué patrón de diseño trabaja en cada parte de la pantalla">
            <input type="checkbox" id="modo-patrones"><span></span>Patrones
          </label>
          <button class="icono-btn" id="tema" aria-label="Cambiar entre modo claro y oscuro"></button>
          <div class="campana">
            <button class="icono-btn" id="abrir-avisos" aria-label="Movimientos recientes" aria-expanded="false" aria-controls="panel-avisos"></button>
            <span class="contador" id="no-leidos" hidden>0</span>
            <div class="menu-flotante" id="panel-avisos" hidden></div>
          </div>
        </div>
      </header>

      <main id="vista" tabindex="-1"></main>
    </div>
  </div>

  <div class="cortina" id="cortina" hidden></div>
  <aside class="cajon" id="cajon" role="dialog" aria-modal="true" aria-labelledby="cajon-titulo" hidden></aside>
  <div class="paleta" id="paleta" role="dialog" aria-modal="true" aria-label="Buscador rápido" hidden></div>
  <div class="avisos" id="avisos" aria-live="polite"></div>
  <div class="tooltip" id="tooltip" role="status" hidden></div>
  <div class="festejo" id="festejo" aria-hidden="true"></div>
  <div class="imprimible" id="imprimible" aria-hidden="true"></div>

  <script src="/estatico/mapa.js"></script>
  <script src="/estatico/app.js"></script>
</body>
</html>

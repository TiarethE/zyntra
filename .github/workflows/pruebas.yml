name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependencias de la interfaz web
        run: pip install -r requirements.txt
      - name: Correr pruebas
        run: python -m unittest -v
      - name: Correr la demostración
        run: python -m zyntra.demo
